<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonique: Orbital Mechanics Payload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="stage" width="480" height="270"></canvas>

    <!-- Live Analytical Readout Bar -->
    <div id="telemetry-bar">
        <div class="telemetry-item">REGIME: <span id="regime-readout">INIT</span></div>
        <div class="telemetry-item">ω₀: <span id="w0-readout">0.00</span> rad/s</div>
        <div class="telemetry-item">ζ: <span id="zeta-readout">0.00</span></div>
        <div class="telemetry-item">X_EQ: <span id="xeq-readout">0.00</span> m</div>
        <div class="telemetry-item">E_TOT: <span id="energy-readout">0.00</span> J</div>
        <div class="telemetry-item">T: <span id="time-readout">0.00</span> s</div>
    </div>

    <!-- 6-Parameter Control Matrix -->
    <div id="controls-matrix">
        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-m">MASS (m)</label>
                <span class="slider-val" id="val-m">2.0 kg</span>
            </div>
            <input type="range" id="slider-m" min="0.5" max="10.0" step="0.1" value="2.0">
        </div>

        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-k">STIFFNESS (k)</label>
                <span class="slider-val" id="val-k">25 N/m</span>
            </div>
            <input type="range" id="slider-k" min="5.0" max="100.0" step="1.0" value="25.0">
        </div>

        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-c">HYSTERESIS DAMPING (c)</label>
                <span class="slider-val" id="val-c">1.5 N·s/m</span>
            </div>
            <input type="range" id="slider-c" min="0.0" max="15.0" step="0.1" value="1.5">
        </div>

        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-f0">DRIVE AMPLITUDE (F₀)</label>
                <span class="slider-val" id="val-f0">0.0 N</span>
            </div>
            <input type="range" id="slider-f0" min="0.0" max="30.0" step="0.5" value="0.0">
        </div>

        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-w">DRIVE FREQ (ω)</label>
                <span class="slider-val" id="val-w">3.5 rad/s</span>
            </div>
            <input type="range" id="slider-w" min="0.5" max="12.0" step="0.1" value="3.5">
        </div>

        <div class="slider-cell">
            <div class="slider-header">
                <label for="slider-g">GRAVITY FIELD (g)</label>
                <span class="slider-val" id="val-g">0.0 m/s²</span>
            </div>
            <input type="range" id="slider-g" min="0.0" max="20.0" step="0.2" value="0.0">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
